name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      CIPHERSCOPE_HASH_SALT: ci-only-salt-not-a-secret-0001
      CIPHERSCOPE_ADMIN_TOKEN: ci-only-token-not-a-secret-0001
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q --cov=cipherscope --cov-fail-under=80
      - run: uv run python -m cipherscope.eval.runner
      - run: uv run python site/scripts/export_fixtures.py
      - run: git diff --exit-code -- site/src/data/results.generated.json site/src/features/simulator/__fixtures__

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  docker:
    runs-on: ubuntu-latest
    env:
      CIPHERSCOPE_HASH_SALT: ci-only-salt-not-a-secret-0001
      CIPHERSCOPE_ADMIN_TOKEN: ci-only-token-not-a-secret-0001
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build
