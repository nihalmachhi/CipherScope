[project]
name = "cipherscope"
version = "0.2.0"
description = "Privacy-first encrypted traffic metadata intelligence and evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.162.0,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "scapy>=2.6,<3",
  "numpy>=2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6,<7",
]
parquet = ["pyarrow>=17,<22"]
deep = ["torch>=2.4,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cipherscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["cipherscope"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S311"]
"src/cipherscope/datasets/*" = ["S311"]
"src/cipherscope/robustness/*" = ["S311"]
"src/cipherscope/eval/runner.py" = ["S311"]
"src/cipherscope/eval/report.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["cipherscope"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scapy.*", "sklearn.*", "yaml.*"]
ignore_missing_imports = true
